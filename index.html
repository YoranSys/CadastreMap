<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CadastreMap : Recherchez et visualisez facilement les parcelles cadastrales en France. Application interactive avec carte Leaflet, recherche par commune, filtrage avancé par contenance, détection de parcelles mitoyennes et liens vers DVF et Géoportail.">
    <meta name="keywords" content="cadastre, parcelle cadastrale, carte cadastrale, France, DVF, géoportail, recherche parcelle, cadastre France, plan cadastral, SIG, cartographie, immobilier, terrain, foncier">
    <meta name="author" content="YoranSys">
    <meta name="robots" content="index, follow">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://yoransys.github.io/CadastreMap/">
    <meta property="og:title" content="CadastreMap - Visualisation Interactive des Parcelles Cadastrales en France">
    <meta property="og:description" content="Recherchez et visualisez facilement les parcelles cadastrales françaises avec notre carte interactive. Filtrage avancé, détection de parcelles mitoyennes, liens vers DVF et Géoportail.">
    <meta property="og:image" content="https://yoransys.github.io/CadastreMap/icon-512.png">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://yoransys.github.io/CadastreMap/">
    <meta property="twitter:title" content="CadastreMap - Visualisation Interactive des Parcelles Cadastrales en France">
    <meta property="twitter:description" content="Recherchez et visualisez facilement les parcelles cadastrales françaises avec notre carte interactive. Filtrage avancé, détection de parcelles mitoyennes, liens vers DVF et Géoportail.">
    <meta property="twitter:image" content="https://yoransys.github.io/CadastreMap/icon-512.png">
    
    <!-- PWA -->
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="CadastreMap">
    <title>CadastreMap - Visualisation Interactive des Parcelles Cadastrales en France</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📍 CadastreMap</h1>
            <p style="color: #718096; margin-top: 12px; font-size: 1.1rem; font-weight: 400;">Visualisation interactive des parcelles cadastrales françaises avec recherche avancée, détection de terrains mitoyens et liens vers les données foncières officielles</p>
        </header>
        <main>
            <div class="search-container">
                <div style="position: relative;">
                    <input type="text" id="commune-search" placeholder="🏘️ Nom de la commune ou code postal">
                    <div id="commune-suggestions"></div>
                </div>
                <input type="number" id="contenance-input" placeholder="📏 Contenance">
                <input type="text" id="prefixe-input" placeholder="🔤 Prefixe">
                <input type="text" id="section-input" placeholder="📋 Section">
                <input type="text" id="numero-input" placeholder="🔢 Numero">
                <label for="include-adjacent">
                    <input type="checkbox" id="include-adjacent"> Inclure terrains mitoyens
                </label>
                <button id="search-btn">🔍 Rechercher</button>
            </div>
            <div class="content-wrapper">
                <div id="results-list">
                    <h2>📊 Résultats de recherche</h2>
                    <ul id="results">
                        <li class="empty-state">
                            <div class="empty-state-icon">🗺️</div>
                            <div>Effectuez une recherche pour voir les parcelles</div>
                        </li>
                    </ul>
                </div>
                <div id="map"></div>
            </div>
        </main>
    </div>
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.0.4/pako.min.js"></script>
    <script src="script.js"></script>
    <script>
        // Register service worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => {
                        console.log('Service Worker registered successfully:', registration.scope);
                    })
                    .catch(error => {
                        console.log('Service Worker registration failed:', error);
                    });
            });
        }
    </script>
</body>
</html>
