<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Application pour visualiser et rechercher des parcelles cadastrales en France">
    <meta name="theme-color" content="#4CAF50">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="CadastreMap">
    <title>Cadastre Map Dynamique</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Cadastre Map Dynamique</h1>
        </header>
        <main>
            <div class="search-container">
                <input type="text" id="commune-search" placeholder="Nom de la commune">
                <div id="commune-suggestions"></div>
                <input type="number" id="contenance-input" placeholder="Contenance">
                <input type="text" id="prefixe-input" placeholder="Prefixe">
                <input type="text" id="section-input" placeholder="Section">
                <input type="text" id="numero-input" placeholder="Numero">
                <label for="include-adjacent">
                    <input type="checkbox" id="include-adjacent"> Inclure terrains mitoyens
                </label>
                <button id="search-btn">Rechercher</button>
            </div>
            <div class="content-wrapper">
                <div id="results-list">
                    <h2>Résultats de recherche</h2>
                    <ul id="results"></ul>
                </div>
                <div id="map"></div>
            </div>
        </main>
    </div>
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.0.4/pako.min.js"></script>
    <script src="script.js"></script>
    <script>
        // Register service worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => {
                        console.log('Service Worker registered successfully:', registration.scope);
                    })
                    .catch(error => {
                        console.log('Service Worker registration failed:', error);
                    });
            });
        }
    </script>
</body>
</html>
